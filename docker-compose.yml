services:
  postgres:
    image: postgres:16-alpine
    container_name: liveclass-postgres
    environment:
      POSTGRES_DB: liveclass
      POSTGRES_USER: liveclass
      POSTGRES_PASSWORD: liveclass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liveclass -d liveclass"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: liveclass-event-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql://liveclass:liveclass@postgres:5432/liveclass
      INITIAL_EVENT_COUNT: 50000
      EVENT_BATCH_SIZE: 100
      EVENT_INTERVAL_SECONDS: 5
      ANALYTICS_INTERVAL_SECONDS: 30
    restart: unless-stopped

volumes:
  postgres_data:
